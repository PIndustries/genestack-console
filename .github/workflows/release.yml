name: release

# Public release only. Branch pushes and pull requests do not run this
# workflow, so day-to-day work does not take a fleet runner.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version matching app/version.py, with or without a leading v"
        required: true
        type: string
      parts:
        description: "all publishes the program, then the disk, then the ISO. binary publishes only the program. disk or iso uploads that file onto the existing release and does not change latest."
        required: false
        type: choice
        default: all
        options:
          - all
          - binary
          - disk
          - iso

permissions:
  contents: write

concurrency:
  group: genestack-console-release
  cancel-in-progress: false

jobs:
  binary:
    if: >-
      github.repository == 'PIndustries/genestack-console' &&
      github.event.repository.fork == false &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: [self-hosted, Linux, X64, phx, fleet, org]
    timeout-minutes: 120
    outputs:
      tag: ${{ steps.ver.outputs.tag }}
      version: ${{ steps.ver.outputs.version }}
    env:
      GSC_SKIP_PUBLISH: "1"
      PIP_BREAK_SYSTEM_PACKAGES: "1"
      KUBECONFIG: ""
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Check version
        id: ver
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          text = Path("app/version.py").read_text()
          match = re.search(r'^VERSION\s*=\s*"([^"]+)"\s*$', text, re.M)
          if not match:
              raise SystemExit("app/version.py has no VERSION")
          version = match.group(1)
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              raw = os.environ.get("INPUT_VERSION", "").strip()
              if not raw:
                  raise SystemExit("workflow_dispatch requires version")
              tag = raw if raw.startswith("v") else "v" + raw
          else:
              tag = os.environ["REF_NAME"]
          if not re.fullmatch(r"v\d{4}\.\d{2}\.\d{2}(\.\d+)?(-[0-9A-Za-z.]+)?", tag):
              raise SystemExit(f"refused tag shape: {tag}")
          bare = tag[1:]
          if bare != version:
              raise SystemExit(f"{tag} does not match app/version.py {version}")
          prerelease = "-" in bare
          out = Path(os.environ["GITHUB_OUTPUT"])
          with out.open("a") as fh:
              fh.write(f"tag={tag}\n")
              fh.write(f"version={version}\n")
              fh.write(f"prerelease={'true' if prerelease else 'false'}\n")
              fh.write(f"make_latest={'false' if prerelease else 'true'}\n")
          print(f"tag={tag} version={version} prerelease={prerelease}")
          PY

      # disk and iso attach to a release the program publish already created.
      # A missing release fails here. This step does not create one and does
      # not change latest. Tag pushes are not workflow_dispatch, so they skip it.
      - name: Require an existing release
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.parts == 'disk' || inputs.parts == 'iso') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          PARTS: ${{ inputs.parts }}
        run: |
          python3 - <<'PY'
          import os
          import urllib.error
          import urllib.request

          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ.get("GH_TOKEN", "")
          part = os.environ.get("PARTS", "")
          if not token:
              raise SystemExit("GH_TOKEN is empty; cannot read the release")
          url = f"https://api.github.com/repos/{repo}/releases/tags/{tag}"
          req = urllib.request.Request(
              url,
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "genestack-console-release",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as res:
                  if res.status != 200:
                      raise SystemExit(
                          f"could not read GitHub Release {tag}: HTTP {res.status}"
                      )
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  raise SystemExit(
                      f"no GitHub Release for {tag}. "
                      f"parts={part} uploads onto that release and does not create one "
                      "or change latest. Publish the program first "
                      "(parts=all or parts=binary)."
                  )
              raise SystemExit(
                  f"could not read GitHub Release {tag}: HTTP {exc.code}"
              )
          print(f"release {tag} exists")
          PY

      - name: Compile tools
        run: |
          set -euo pipefail
          need=0
          for c in gcc g++ patchelf python3; do
            if ! command -v "$c" >/dev/null 2>&1; then
              echo "missing $c"
              need=1
            fi
          done
          if [ "$need" -eq 1 ]; then
            sudo apt-get update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
              gcc g++ patchelf python3 python3-pip python3-dev ccache zlib1g-dev
          fi
          python3 --version

      - name: Compile
        run: ./scripts/compile-console.sh

      - name: Release URL in version.json
        env:
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          path = Path("dist/version.json")
          data = json.loads(path.read_text())
          name = str(data.get("binary") or "")
          if "/" in name or name.startswith("http"):
              raise SystemExit("version.json binary must be a file name")
          tag = os.environ["TAG"]
          data["binary"] = (
              "https://github.com/PIndustries/genestack-console/releases/download/"
              f"{tag}/{name}"
          )
          version = tag[1:]
          data["appliance"] = (
              "https://github.com/PIndustries/genestack-console/releases/download/"
              f"{tag}/genestack-console-appliance-{version}-amd64.qcow2.xz"
          )
          data["iso"] = (
              "https://github.com/PIndustries/genestack-console/releases/download/"
              f"{tag}/genestack-console-appliance-{version}-amd64.iso"
          )
          path.write_text(json.dumps(data) + "\n")
          print(data["binary"])
          print(data["appliance"])
          print(data["iso"])
          PY

      - name: Stage installer scripts
        run: |
          cp scripts/genestack-console.sh dist/console.sh
          cp scripts/console.ps1 dist/console.ps1

      - name: Write release notes
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ["VERSION"].strip()
          lines = Path("CHANGELOG.md").read_text().splitlines()
          grabbed = []
          take = False
          for line in lines:
              if line.startswith("## "):
                  if take:
                      break
                  take = line[3:].strip() == version
                  continue
              if take:
                  grabbed.append(line)
          notes = "\n".join(grabbed).strip()
          if not notes:
              raise SystemExit(f"CHANGELOG.md has no section for {version}")
          text = (
              f"Genestack Console {version}.\n\n"
              "On a machine you already have, run `console.sh` on Linux or "
              "`console.ps1` on Windows. "
              "https://get.genestack.dev/console.sh and "
              "https://get.genestack.dev/console.ps1 open those files. "
              "`genestack-console-linux-amd64` is the program the Linux installer downloads. "
              "`version.json` tells a running Console which program to download when it updates.\n\n"
              f"`genestack-console-appliance-{version}-amd64.qcow2.xz` is a virtual machine disk "
              "with Console already installed. Decompress it and boot it.\n\n"
              f"`genestack-console-appliance-{version}-amd64.iso` is a CD image. "
              "Boot it, then type the name of the disk to install onto.\n\n"
              f"{notes}\n"
          )
          Path("dist").mkdir(exist_ok=True)
          Path("dist/NOTES.md").write_text(text)
          print(text)
          PY

      # Tag pushes have no parts input; that is all, and this publish stays.
      # disk and iso must not create a release or flip latest.
      - name: Publish GitHub Release
        if: ${{ github.event_name != 'workflow_dispatch' || (inputs.parts != 'disk' && inputs.parts != 'iso') }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          prerelease: ${{ steps.ver.outputs.prerelease }}
          make_latest: ${{ steps.ver.outputs.make_latest }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/genestack-console-linux-*
            dist/version.json
            dist/console.sh
            dist/console.ps1
          body_path: dist/NOTES.md

      - name: Upload binary for the appliance disk
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: console-linux-amd64
          path: dist/genestack-console-linux-amd64
          if-no-files-found: error
          retention-days: 1

  appliance:
    needs: binary
    if: >-
      github.repository == 'PIndustries/genestack-console' &&
      github.event.repository.fork == false &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')) &&
      (github.event_name != 'workflow_dispatch' || inputs.parts != 'binary')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download the Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: console-linux-amd64
          path: dist

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true
          df -h /

      - name: Install podman
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y podman xz-utils

      # One job so podman keeps the appliance image between disk and ISO.
      # The disk step builds the installer image first, then the qcow2, and
      # that file is uploaded before the ISO is built. An ISO failure does
      # not skip that upload and does not remove the qcow2 already attached.
      - name: Build the appliance disk
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.parts != 'iso' }}
        run: |
          chmod 0755 dist/genestack-console-linux-amd64
          ./scripts/build-appliance.sh dist/genestack-console-linux-amd64 disk

      - name: Attach the disk to the release
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.parts != 'iso') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.binary.outputs.tag }}
        run: |
          shopt -s nullglob
          disks=(dist/genestack-console-appliance-*.qcow2.xz)
          if [ "${#disks[@]}" -eq 0 ]; then
            echo "no appliance qcow2 was built" >&2
            exit 1
          fi
          gh release upload "$TAG" "${disks[@]}" --clobber

      - name: Build the installer ISO
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.parts != 'disk' }}
        run: |
          chmod 0755 dist/genestack-console-linux-amd64
          ./scripts/build-appliance.sh dist/genestack-console-linux-amd64 iso

      - name: Attach the installer to the release
        if: ${{ !cancelled() && (github.event_name != 'workflow_dispatch' || inputs.parts != 'disk') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.binary.outputs.tag }}
        run: |
          shopt -s nullglob
          isos=(dist/genestack-console-appliance-*.iso)
          if [ "${#isos[@]}" -eq 0 ]; then
            echo "no installer ISO was built" >&2
            exit 1
          fi
          gh release upload "$TAG" "${isos[@]}" --clobber
