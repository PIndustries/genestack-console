# Local dry-run / preflight inventory for Genestack Console.
# Run playbooks without remote hosts:
#   ansible-playbook -i inventory/localhost.ini playbooks/host_preflight.yml
#
# Genestack node role labels (used when targeting real MAAS nodes):
#   openstack-control-plane, compute, network, storage

[local]
localhost ansible_connection=local ansible_python_interpreter=auto_silent

[control_plane]
# openstack-control-plane nodes (populated from MAAS tags in production)

[compute]
# compute nodes

[network]
# network nodes

[storage]
# storage nodes

[genestack:children]
control_plane
compute
network
storage
local
