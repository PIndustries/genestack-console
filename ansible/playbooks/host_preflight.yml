---
# Host preflight for Genestack Console.
# Gathers facts and checks Python, SSH tooling, and free disk.
# Safe to run against localhost (connection: local) for dry-run.
#
#   ansible-playbook -i inventory/localhost.ini playbooks/host_preflight.yml
#
# Genestack role labels (when run against real nodes):
#   openstack-control-plane | compute | network | storage

- name: Genestack host preflight
  hosts: localhost
  connection: local
  gather_facts: true
  become: false

  roles:
    - role: preflight
