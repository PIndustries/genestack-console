# First boot reads an SSH key from the VM platform.
# virt-install --cloud-init, a NoCloud seed, and an OpenStack key pair
# all land on this user. The service account is genestack and stays nologin.
datasource_list: [NoCloud, ConfigDrive, OpenStack, None]
disable_root: true
ssh_pwauth: false
system_info:
  default_user:
    name: console
    groups: [sudo]
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    shell: /bin/bash
    lock_passwd: true
